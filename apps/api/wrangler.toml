name = "myplv"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Logs d'invocation (Cloudflare dashboard) — utile pour diagnostiquer les
# erreurs 500 en production. Rien de sensible n'y est journalisé au-delà de
# ce que fait déjà onError() dans src/index.ts.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Variables non-sensibles. Les secrets (DATABASE_URL, AUTH_SECRET,
# BREVO_API_KEY, CRON_SECRET...) se posent avec `wrangler secret put <NOM>`,
# jamais dans ce fichier ni dans le code.
[vars]
APP_URL = "https://app.myplv.be"
SESSION_COOKIE_NAME = "myplv_session"
SESSION_TTL_HOURS = "168"
EMAIL_DAILY_LIMIT = "50"
# "None" tant que le frontend (myplv-web.*.workers.dev) et l'API
# (myplv.*.workers.dev) vivent sur deux domaines distincts — sinon le
# cookie de session est refusé par le navigateur après un login pourtant
# réussi. À repasser sur "Lax" (ou retirer, "Lax" est le défaut dans
# routes/auth.ts) une fois les deux servis depuis app.myplv.be.
SESSION_COOKIE_SAMESITE = "None"
# "brevo" active les envois réels (voir createEmailProvider) — la clé
# BREVO_API_KEY (secret, jamais ici) doit être posée pour que ça marche
# vraiment ; sans elle, l'envoi retombe automatiquement sur le simulateur.
EMAIL_PROVIDER = "brevo"
# Doit correspondre à un expéditeur VÉRIFIÉ dans Brevo (Paramètres →
# Expéditeurs, domaines et IP dédiées) — un envoi depuis une adresse non
# vérifiée est accepté par l'API puis rejeté silencieusement par Brevo
# (visible comme "Erreur" dans Temps réel), constaté le 27/08/2026 avec
# le défaut précédent "no-reply@myplv.be", jamais ajouté comme expéditeur.
EMAIL_FROM_ADDRESS = "info@myplv.be"
EMAIL_FROM_NAME = "MYPLV"

# À décommenter une fois le sous-domaine app.myplv.be pointé (voir section 4
# du rapport d'audit) :
# [[routes]]
# pattern = "app.myplv.be/api/*"
# zone_name = "myplv.be"
