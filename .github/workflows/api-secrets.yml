name: Configurer les secrets du Worker API

# Déclenchement manuel — pose les secrets d'exécution (DATABASE_URL,
# AUTH_SECRET, BREVO_API_KEY, CRON_SECRET) directement sur le Worker `myplv`
# via l'API Cloudflare (wrangler), pour éviter toute erreur de manipulation
# dans le dashboard (mauvais onglet, mauvais environnement...).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   — jeton créé sur dash.cloudflare.com/profile/api-tokens
#                            avec le modèle "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — visible dans la barre latérale droite du dashboard
#                            Cloudflare (Workers & Pages → Overview)
#   DATABASE_URL           — déjà présent (utilisé aussi par db-setup.yml)
#   AUTH_SECRET            — optionnel, seulement si déjà ajouté comme secret ici
#   BREVO_API_KEY          — optionnel, seulement si déjà ajouté comme secret ici
#   CRON_SECRET            — optionnel, seulement si déjà ajouté comme secret ici
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: .

      - name: Poser DATABASE_URL
        run: printf '%s' "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL

      - name: Poser AUTH_SECRET
        if: ${{ secrets.AUTH_SECRET != '' }}
        run: printf '%s' "${{ secrets.AUTH_SECRET }}" | npx wrangler secret put AUTH_SECRET

      - name: Poser BREVO_API_KEY
        if: ${{ secrets.BREVO_API_KEY != '' }}
        run: printf '%s' "${{ secrets.BREVO_API_KEY }}" | npx wrangler secret put BREVO_API_KEY

      - name: Poser CRON_SECRET
        if: ${{ secrets.CRON_SECRET != '' }}
        run: printf '%s' "${{ secrets.CRON_SECRET }}" | npx wrangler secret put CRON_SECRET
