name: Configurer les secrets du Worker API

# Déclenchement manuel — pose les secrets d'exécution (DATABASE_URL,
# AUTH_SECRET, BREVO_API_KEY, CRON_SECRET) directement sur le Worker `myplv`
# via l'API Cloudflare (wrangler), pour éviter toute erreur de manipulation
# dans le dashboard (mauvais onglet, mauvais environnement...).
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   — jeton créé sur dash.cloudflare.com/profile/api-tokens
#                            avec le modèle "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — visible dans la barre latérale droite du dashboard
#                            Cloudflare (Workers & Pages → Overview)
#   DATABASE_URL           — déjà présent (utilisé aussi par db-setup.yml)
#   AUTH_SECRET            — optionnel, seulement si déjà ajouté comme secret ici
#   BREVO_API_KEY          — optionnel, seulement si déjà ajouté comme secret ici
#   CRON_SECRET            — optionnel, seulement si déjà ajouté comme secret ici
on:
  workflow_dispatch:

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_VALUE: ${{ secrets.DATABASE_URL }}
      AUTH_SECRET_VALUE: ${{ secrets.AUTH_SECRET }}
      BREVO_API_KEY_VALUE: ${{ secrets.BREVO_API_KEY }}
      CRON_SECRET_VALUE: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: .

      # Requis : Cloudflare refuse de modifier un secret tant que la dernière
      # version du Worker n'est pas "fully deployed" — ce que le déploiement
      # automatique déclenché par le push Git ne garantit pas toujours.
      # (Erreur observée : "Secret edit failed [...] latest version of your
      # Worker isn't currently deployed".)
      - name: Déployer la dernière version avant de toucher aux secrets
        run: npx wrangler deploy

      - name: Poser DATABASE_URL
        run: printf '%s' "$DATABASE_URL_VALUE" | npx wrangler secret put DATABASE_URL

      - name: Poser AUTH_SECRET
        if: ${{ env.AUTH_SECRET_VALUE != '' }}
        run: printf '%s' "$AUTH_SECRET_VALUE" | npx wrangler secret put AUTH_SECRET

      - name: Poser BREVO_API_KEY
        if: ${{ env.BREVO_API_KEY_VALUE != '' }}
        run: printf '%s' "$BREVO_API_KEY_VALUE" | npx wrangler secret put BREVO_API_KEY

      - name: Poser CRON_SECRET
        if: ${{ env.CRON_SECRET_VALUE != '' }}
        run: printf '%s' "$CRON_SECRET_VALUE" | npx wrangler secret put CRON_SECRET
