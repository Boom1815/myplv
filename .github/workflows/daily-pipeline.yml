name: Pipeline quotidien (import, scoring, envoi)

# Déclenchement manuel uniquement pour l'instant (workflow_dispatch). Le
# planning automatique (brief section 47) sera activé — en décommentant le
# bloc `schedule` ci-dessous — une fois DATABASE_URL/CRON_SECRET configurés
# comme secrets du dépôt et le pipeline validé manuellement au moins une
# fois. Ne pas activer un cron sur un pipeline qui envoie des emails avant
# d'avoir testé le mode Dry Run (brief section 49/50).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - production
  # schedule:
  #   - cron: "0 5 * * *" # 05:00 UTC — ajuster une fois le pipeline validé

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Import KBO Open Data (delta)
        run: echo "TODO — brancher le téléchargement du fichier delta KBO Open Data puis npm run import:kbo -- --dir <chemin>"

